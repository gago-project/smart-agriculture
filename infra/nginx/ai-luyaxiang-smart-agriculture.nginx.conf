# 苏农云指挥调度智能 (smart-agriculture / sa-web) — 独立 nginx master 前门。
# 链路：ai.luyaxiang.com / ai.leouuu.com → cloudflared 命名隧道 → 127.0.0.1:5173 (此 nginx) → web :18030。
# 主品牌域 = ai.leouuu.com；旧 ai.luyaxiang.com 一律 301 → https://ai.leouuu.com（与 ai-demos fleet 一致）。
# 部署：copy 到 ~/.doc-cloud/config/ 后 `nginx -t -c <dest> && nginx -s reload -c <dest>`（或 start）。
worker_processes  1;

error_log  /Users/mac/.doc-cloud/logs/ai-luyaxiang-smart-agriculture.nginx.error.log info;
pid        /Users/mac/.doc-cloud/logs/ai-luyaxiang-smart-agriculture.nginx.pid;

events {
  worker_connections  1024;
}

http {

  # 旧域 301 → leouuu（luyaxiang 逐步下线）
  server {
    listen 127.0.0.1:5173;
    server_name ai.luyaxiang.com;
    return 301 https://ai.leouuu.com$request_uri;
  }

  include       /opt/homebrew/etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /Users/mac/.doc-cloud/logs/ai-luyaxiang-smart-agriculture.nginx.access.log main;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  sendfile        on;
  keepalive_timeout  65;

  server {
    listen 127.0.0.1:5173;
    server_name ai.leouuu.com;

    location / {
      proxy_pass http://127.0.0.1:18030;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }
  }
}
